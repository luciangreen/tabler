<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabler</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar tbar">
    <h1>Tabler</h1>
    <input id="title" class="title" aria-label="Site name" value="My shop">
    <span class="spacer"></span>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="new">New</button>
    <button id="open">Open…</button>
    <button id="save">Save</button>
    <select id="export" aria-label="Export"><option value="">Export…</option><option value="site">Site program (.pl)</option><option value="funnel">Funnel program (.pl)</option><option value="csv">Table as CSV</option><option value="pl">Prolog form (.pl)</option></select>
  </header>
  <nav class="tabs main-tabs" id="tabs" role="tablist"></nav>
  <main class="tabler">
    <section class="panel" id="editor"></section>
    <aside class="panel preview-panel">
      <div class="row"><strong id="previewTitle">Preview</strong><span class="spacer"></span><select id="previewPage" aria-label="Page to preview"></select></div>
      <iframe id="preview" title="Preview" sandbox=""></iframe>
    </aside>
  </main>
  <form id="say" class="row say"><input id="sayText" type="text" placeholder='Tell Lucian: "add a table called customers with name, email and spend (number)", "make a report of total value in products by category", "use PayPal for payments"'><button>Do</button></form>
  <p id="reply" class="quiet" aria-live="polite"></p>
</body>
</html>
